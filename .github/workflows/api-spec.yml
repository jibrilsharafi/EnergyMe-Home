name: API Spec

on:
  push:
    branches: [ development, main ]
    paths:
      - 'source/resources/swagger.yaml'
      - '.github/workflows/api-spec.yml'
  pull_request:
    branches: [ development, main ]
    paths:
      - 'source/resources/swagger.yaml'
      - '.github/workflows/api-spec.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate OpenAPI spec
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11.7'

    - name: Install validator
      run: pip install openapi-spec-validator==0.7.1

    # The spec is embedded in the firmware and served to Swagger UI, which renders
    # nothing at all if the YAML does not parse
    - name: Validate swagger.yaml
      run: openapi-spec-validator source/resources/swagger.yaml
